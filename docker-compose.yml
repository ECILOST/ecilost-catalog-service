services:
  postgres:
    image: postgres:17-alpine
    container_name: ecilost-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecilost
      POSTGRES_PASSWORD: ecilost
      POSTGRES_DB: ecilost_catalog
    ports:
      - '5434:5432'
    volumes:
      - ecilost-catalog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecilost -d ecilost_catalog']
      interval: 5s
      timeout: 5s
      retries: 10

  # Emulador local del servicio de Blob Storage usado en Azure.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: ecilost-catalog-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --disableProductStyleUrl --location /data --debug /data/debug.log
    ports:
      - '10000:10000'
    volumes:
      - ecilost-catalog-azurite:/data

volumes:
  ecilost-catalog-pgdata:
  ecilost-catalog-azurite:
